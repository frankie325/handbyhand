experiment_name: cuda_raod
seed: 42
device: cuda

data:
  image_dir: ../datasets/RAOD-benchmark/select_1000_images
  train_annotations: ../datasets/RAOD-benchmark/annotations/instances_train.json
  val_annotations: ../datasets/RAOD-benchmark/annotations/instances_val.json
  num_classes: 1
  class_names: [abandoned_object]
  resolution: 512
  horizontal_flip: 0.5
  color_jitter: 0.15
  random_scale_min: 0.8
  random_scale_max: 1.0
  max_train_samples: null
  max_val_samples: null

model:
  backbone: dinov2
  dinov2_name: facebook/dinov2-small
  feature_layers: [3, 6, 9, 12]
  num_windows: 2
  window_block_indexes: [0, 1, 3, 4, 6, 7, 9, 10]
  freeze_backbone: false
  hidden_dim: 256
  num_queries: 300
  num_decoder_layers: 4
  num_heads: 8
  num_points: 4
  dropout: 0.0

train:
  output_dir: outputs/cuda_raod
  epochs: 100
  batch_size: 4
  num_workers: 4
  learning_rate: 0.0001
  backbone_learning_rate: 0.00001
  weight_decay: 0.0001
  warmup_steps: 500
  gradient_clip_norm: 0.1
  gradient_accumulation_steps: 4
  amp: true
  validate_every: 1
  log_every: 20
  resume: null

nas:
  enabled: true
  resolutions: [320, 384, 512]
  query_counts: [50, 100, 300]
  decoder_depths: [2, 3, 4]
  eval_batches: null
  latency_warmup: 10
  latency_runs: 50
