__include__: [
  '../dataset/raod_detection.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/rtdetr_r50vd.yml',
]

output_dir: ./output/rtdetr_r50vd_6x_raod

# RAOD-specific training overrides.
epoches: 100

# Save an additional numbered checkpoint every 10 epochs.
checkpoint_step: 10

num_classes: 1
remap_mscoco_category: False

train_dataloader:
  batch_size: 8
  num_workers: 4

val_dataloader:
  batch_size: 8
  num_workers: 4

# Keep the official RT-DETR R50 configuration and its three feature levels
# (stride 8/16/32), which is important for the small objects in RAOD.
PResNet:
  depth: 50
  pretrained: True
